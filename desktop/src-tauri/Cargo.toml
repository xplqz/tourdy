[package]
name = "tourdy"
version = "1.0.0"
description = "투어디 — 공부한 시간만큼 떠나는 여행"
authors = ["Monocle Software"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
