# 투어디 PC(윈도우) 앱 자동 빌드
# desktop/ 폴더가 바뀌어 push되면 윈도우 설치 파일(.exe)을 만들어
# GitHub Releases의 'desktop-v<버전>' 항목에 올림.
# 웹(GitHub Pages)만 고친 경우엔 다시 빌드할 필요 없음 — 앱이 웹 주소를 불러오므로 자동 반영됨.
name: 투어디 PC 앱 빌드

on:
  push:
    branches: [main, desktop-windows]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Tauri CLI 설치
        working-directory: desktop
        run: npm ci

      - name: 빌드 및 릴리스 업로드
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: '투어디 PC v__VERSION__'
          releaseBody: '윈도우용 투어디 설치 파일입니다. 아래 Assets에서 .exe를 받아 실행하세요.'
          releaseDraft: false
          prerelease: true

      - name: 설치 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: tourdy-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
